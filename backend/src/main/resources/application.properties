spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cartridge_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cartridge_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cartridge_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

app.jwt.secret=${APP_JWT_SECRET:change-this-secret-before-production-change-this-secret-before-production}
app.jwt.ttl-minutes=${APP_JWT_TTL_MINUTES:30}

app.hall-request.sla.low-hours=${APP_HALL_REQUEST_SLA_LOW_HOURS:72}
app.hall-request.sla.medium-hours=${APP_HALL_REQUEST_SLA_MEDIUM_HOURS:24}
app.hall-request.sla.high-hours=${APP_HALL_REQUEST_SLA_HIGH_HOURS:8}
app.hall-request.sla.urgent-hours=${APP_HALL_REQUEST_SLA_URGENT_HOURS:2}
app.hall-request.escalation-interval-ms=${APP_HALL_REQUEST_ESCALATION_INTERVAL_MS:300000}
